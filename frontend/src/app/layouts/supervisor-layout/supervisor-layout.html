<div class="shell" [class.is-collapsed]="collapsed()">
  @if (drawerOpen()) {
    <div class="drawer-backdrop" (click)="closeDrawer()" aria-hidden="true"></div>
  }

  <!-- ============ Sidebar ============ -->
  <aside class="sidebar" [class.is-open]="drawerOpen()">
    <div class="sidebar__head">
      <app-brand />
    </div>

    <nav class="sidebar__nav" aria-label="Main navigation">
      @for (item of navItems; track item.label) {
        <a
          class="nav-item"
          [routerLink]="item.link"
          routerLinkActive="nav-item--active"
          [title]="item.label"
          (click)="closeDrawer()"
        >
          <i [class]="item.icon"></i>
          <span class="nav-item__label">{{ item.label }}</span>
        </a>
      }
    </nav>

    <div class="sidebar__foot">
      @if (userMenuOpen()) {
        <app-profile-menu (signedOut)="signOut()" />
      }

      <button
        type="button"
        class="user-card"
        (click)="toggleUserMenu()"
        [attr.aria-expanded]="userMenuOpen()"
        aria-haspopup="menu"
      >
        @if (auth.avatarSrc(); as src) {
          <span class="avatar avatar--md"><img [src]="src" alt="" /></span>
        } @else {
          <span class="avatar avatar--md">{{ auth.initials() }}</span>
        }
        <span class="user-card__meta">
          <span class="user-card__name">{{ auth.fullName() }}</span>
          <span class="user-card__role">{{ roleLabel() }}</span>
        </span>
        <i
          class="fa-solid fa-chevron-up user-card__chev"
          [class.is-open]="userMenuOpen()"
        ></i>
      </button>
    </div>
  </aside>

  <!-- ============ Main ============ -->
  <div class="main">
    <header class="topbar">
      <button
        type="button"
        class="icon-btn"
        (click)="toggleSidebar()"
        aria-label="Toggle navigation"
      >
        <i class="fa-solid fa-bars"></i>
      </button>

      <div class="topbar__title">
        <h1 class="topbar__h1">
          {{ topbar().title }}
          <span class="dept-chip" [title]="deptLabel()">{{ deptShort() }}</span>
        </h1>
        <p class="topbar__sub">
          <span class="topbar__sub-desk">{{ topbar().sub }}</span>
          <span class="topbar__sub-mob">{{ topbar().mob }}</span>
        </p>
      </div>

      <div class="topbar__brand">
        <app-brand [compact]="true" />
      </div>

      <div class="topbar__actions">
        <span class="icon-btn bell" title="Waiting for your approval">
          <i class="fa-regular fa-bell"></i>
          @if (pendingCount() > 0) {
            <span class="bell__badge">{{ pendingCount() }}</span>
          }
        </span>

        <div class="date-pill" title="Today">
          <i class="fa-regular fa-calendar"></i>
          <span>Mon, Nov 9, 2026</span>
          <i class="fa-solid fa-chevron-down"></i>
        </div>

        <button
          type="button"
          class="avatar avatar--md avatar--btn"
          [title]="'Profile — ' + auth.fullName()"
          (click)="toggleUserMenu()"
          [attr.aria-expanded]="userMenuOpen()"
          aria-haspopup="menu"
          aria-label="Open profile menu"
        >
          @if (auth.avatarSrc(); as src) {
            <img [src]="src" alt="" />
          } @else {
            {{ auth.initials() }}
          }
        </button>
      </div>
    </header>

    <main class="content">
      <router-outlet />
    </main>
  </div>

  <!-- ============ Mobile bottom navigation ============ -->
  <nav class="bottom-nav" aria-label="Quick navigation">
    <a
      class="bottom-nav__item"
      routerLink="/supervisor/dashboard"
      routerLinkActive="bottom-nav__item--active"
      [routerLinkActiveOptions]="{ exact: true }"
      title="Dashboard"
      (click)="closeDrawer()"
    >
      <i class="fa-solid fa-gauge-high"></i>
      <span>Home</span>
    </a>
    <a
      class="bottom-nav__item"
      routerLink="/supervisor/tasks"
      routerLinkActive="bottom-nav__item--active"
      title="Tasks"
      (click)="closeDrawer()"
    >
      <i class="fa-solid fa-list-check"></i>
      <span>Tasks</span>
    </a>
    <a
      class="bottom-nav__item"
      routerLink="/supervisor/reports"
      routerLinkActive="bottom-nav__item--active"
      title="Reports"
      (click)="closeDrawer()"
    >
      <i class="fa-solid fa-file-lines"></i>
      <span>Reports</span>
    </a>
    <span class="bottom-nav__fab-slot">
      <span class="bottom-nav__fab" title="Coming soon">
        <i class="fa-solid fa-plus"></i>
      </span>
    </span>
    <a
      class="bottom-nav__item"
      routerLink="/supervisor/attendance"
      routerLinkActive="bottom-nav__item--active"
      title="Attendance"
      (click)="closeDrawer()"
    >
      <i class="fa-solid fa-clock"></i>
      <span>Attend.</span>
    </a>
    <a
      class="bottom-nav__item"
      routerLink="/supervisor/workers"
      routerLinkActive="bottom-nav__item--active"
      title="Workers"
      (click)="closeDrawer()"
    >
      <i class="fa-solid fa-users"></i>
      <span>Workers</span>
    </a>
    <a
      class="bottom-nav__item"
      routerLink="/supervisor/transactions"
      routerLinkActive="bottom-nav__item--active"
      title="Transactions"
      (click)="closeDrawer()"
    >
      <i class="fa-solid fa-money-bill-transfer"></i>
      <span>Trans.</span>
    </a>
  </nav>
</div>
